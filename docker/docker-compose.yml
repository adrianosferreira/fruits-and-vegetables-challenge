services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: php -S 0.0.0.0:8080 -t /app/public
    ports:
      - "8080:8080"
    volumes:
      - ../:/app
    depends_on:
      - redis
    networks:
      app-network:

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      app-network:

networks:
  app-network: